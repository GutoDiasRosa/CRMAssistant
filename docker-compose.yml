services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crmassistant
    ports:
      - "5432:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crmassistant"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: postgresql+asyncpg://crm:crm@db:5432/crmassistant
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-string}
      RD_WEBHOOK_SECRET: ${RD_WEBHOOK_SECRET:-}
      RD_CLIENT_ID: ${RD_CLIENT_ID:-}
      RD_CLIENT_SECRET: ${RD_CLIENT_SECRET:-}
      RD_REDIRECT_URI: ${RD_REDIRECT_URI:-http://localhost:8000/oauth/rd/callback}
      RD_OAUTH_AUTHORIZE_URL: ${RD_OAUTH_AUTHORIZE_URL:-https://api.rd.services/auth/dialog}
      RD_OAUTH_TOKEN_URL: ${RD_OAUTH_TOKEN_URL:-https://api.rd.services/auth/token}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy

volumes:
  crm_pgdata:
